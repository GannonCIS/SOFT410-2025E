plugins {
    id 'java'
    id 'application'
}

group = 'com.cbozan'
version = '1.0.0'

java {
    // Use Java compilation compatibility settings. We rely on the system JDK
    // Compatible with both Java 17 (Jenkins) and Java 21+ (development)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // H2 embedded database (works without installation)
    implementation 'com.h2database:h2:2.2.224'
    // Keep PostgreSQL driver for future use
    implementation 'org.postgresql:postgresql:42.7.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

application {
    // Desktop/Swing entry point
    mainClass = 'com.cbozan.main.Main'
    // Reduce memory for systems with limited RAM
    applicationDefaultJvmArgs = ['-Xmx512m', '-Xms256m']
}

sourceSets {
    main {
        java {
            // Use existing Eclipse layout
            srcDirs = ['src']
            exclude '**/test/**'
        }
        resources {
            // If you keep .properties/.xml/etc alongside sources, include them as resources
            srcDirs = ['src']
            include '**/*.properties', '**/*.xml'
            exclude '**/*.java', '**/*.class', '**/test/**'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

test {
    useJUnitPlatform()
    
    // Pass system properties from command line to tests
    systemProperty 'TEST_MODE', System.getProperty('TEST_MODE', 'true')
    systemProperty 'java.awt.headless', System.getProperty('java.awt.headless', 'true')
    systemProperty 'DB_URL', System.getProperty('DB_URL', 'jdbc:postgresql://localhost:5432/Hesap-eProject')
    systemProperty 'DB_USER', System.getProperty('DB_USER', 'Hesap-eProject')
    systemProperty 'DB_PASSWORD', System.getProperty('DB_PASSWORD', '.hesap-eProject.')
    
    // Skip tests that require GUI or specific database setup in CI environment
    if (System.getProperty('CI') == 'true' || System.getProperty('java.awt.headless') == 'true') {
        exclude '**/DAOIntegrationTest.class'
        exclude '**/SimpleDBTest.class'
        exclude '**/BasicApplicationTest.class'
        // Only run entity tests that don't need GUI
        include '**/EntityTest.class'
    }
    
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Consistent encoding and Java 17 compiler options for Jenkins compatibility
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
    options.release = 17
}

// Make the fat jar runnable by double-click/`java -jar`
tasks.jar {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
    
    // Include all dependencies in the JAR (fat JAR)
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
